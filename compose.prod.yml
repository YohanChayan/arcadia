# =============================================================================
#  Arcadia — production stack, for a host running the shared platform: one
#  Caddy on the external `edge` network, one MySQL on the external `db`
#  network. The same shape as yhn-dev-side's, plus Arcadia's own Postgres for
#  its vector store. See DOCKER.md § Production.
#
#    docker compose -f compose.prod.yml build
#    docker compose -f compose.prod.yml up -d
#
#  No service publishes a port: Docker bypasses the host firewall, so a
#  `ports:` line here would be public. Caddy reaches `arcadia-web` over
#  `edge`; nothing else joins `edge`.
#
#  Service names are prefixed: every stack on the host shares `edge` and `db`,
#  and each service name becomes a DNS name on every network it joins.
# =============================================================================

name: arcadia

x-php: &php
  image: arcadia-app
  restart: unless-stopped
  user: www-data
  env_file: .env
  volumes:
    - storage:/var/www/storage
  networks:
    - internal
    - db

services:
  # ---- PHP-FPM ---------------------------------------------------------
  arc-app:
    <<: *php
    build:
      context: .
      target: prod
    mem_limit: 512m
    depends_on:
      - arc-vectors

  # ---- Queue worker ----------------------------------------------------
  #  Every mail goes out through a queued job (`App\Enums\QueueName`).
  #  `queue:work`, not `queue:listen`: the code only changes with a new image.
  arc-queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--queue=arcadia", "--tries=3", "--backoff=10", "--max-time=3600"]
    mem_limit: 256m
    depends_on:
      - arc-app

  #  No scheduler: Arcadia schedules nothing (routes/console.php).

  # ---- Postgres + pgvector: the vector store ---------------------------
  #  Arcadia's own, on `internal` only — not the platform's, which is MySQL. It
  #  holds the knowledge index, derived from the guides in MySQL and rebuilt by
  #  a command, so a lost volume costs a rebuild, not data. Compose reads the
  #  credentials from the same `.env` (VECTOR_DB_*).
  arc-vectors:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VECTOR_DB_DATABASE:-arcadia_vectors}
      POSTGRES_USER: ${VECTOR_DB_USERNAME:-arcadia}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:?set VECTOR_DB_PASSWORD in .env}
    volumes:
      - vectors:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - internal

  # ---- Inertia SSR -----------------------------------------------------
  #  Reached by the app as http://arc-ssr:13714 (INERTIA_SSR_URL).
  arc-ssr:
    image: arcadia-ssr
    build:
      context: .
      target: ssr
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - internal

  # ---- nginx: the only service Caddy talks to --------------------------
  arc-web:
    image: arcadia-web
    build:
      context: .
      target: web
    container_name: arcadia-web
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - storage:/var/www/storage:ro
    networks:
      - internal
      - edge
    depends_on:
      - arc-app

volumes:
  storage:
  vectors:

networks:
  internal: {}
  edge:
    external: true
  db:
    external: true
