# Arcadia's web server: serves `public/` and hands PHP to the `app` container.
# In production Caddy sits in front of this and terminates TLS; here it is the
# whole entrypoint, on http://localhost:8083.
server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    # Docker's DNS, asked again every 10s: `app` gets a new address whenever it is
    # recreated, and a name resolved once at startup would keep the old one (a 502).
    resolver 127.0.0.11 valid=10s;
    set $php app:9000;

    # Above PHP's post_max_size (25M), so PHP is the one that refuses an upload.
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass $php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
