; The FPM pool for compose.prod.yml, loaded after the image's own www.conf and zz-docker.conf.
; The studio's pool (yhn-dev-side): the image default of 5 children was reached on its staging
; host by one crawler fetching every page (2026-10-27). A worker uses about 50 MB, so 8 fits the
; container's 512m with room to spare.
[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
