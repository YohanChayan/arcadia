# Arcadia's web server on the OVHcloud host: serves `public/` and hands PHP to
# arc-app. Caddy sits in front, terminates TLS and decides which host reaches this
# container, so there is no TLS and no host check here. Caddy's X-Forwarded-*
# headers pass through to PHP untouched; the app trusts them (bootstrap/app.php).
server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    root /var/www/public;
    index index.php;

    # Docker's DNS, asked again every 10s: arc-app gets a new address whenever it is
    # recreated, and a name resolved once at startup would keep the old one (a 502).
    resolver 127.0.0.11 valid=10s;
    set $php arc-app:9000;

    # Above PHP's post_max_size (25M), so PHP is the one that refuses an upload.
    client_max_body_size 32M;

    # Vite's output is content-hashed: a changed file is a new name.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The code is not in this container, only `public/`: PHP resolves the script
    # inside arc-app, at the same path.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass $php;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
